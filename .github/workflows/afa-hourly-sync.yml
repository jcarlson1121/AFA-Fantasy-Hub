
name: AFA Fantasy Hub Data Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dynasty-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check Dynasty Tracker API
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://www.dynastytracker.app/api/view-dynasty?code=w5g1f7e9"

          with urllib.request.urlopen(url, timeout=60) as response:
              data = json.load(response)

          if not isinstance(data, (dict, list)) or not data:
              raise ValueError("Empty or invalid league data")

          print("Dynasty Tracker JSON retrieved successfully.")
          print("Top-level data type:", type(data).__name__)
          PY
