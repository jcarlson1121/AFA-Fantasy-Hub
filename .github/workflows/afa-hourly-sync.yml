
name: AFA Fantasy Hub Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: afa-fantasy-sync
  cancel-in-progress: false

jobs:
  sync-dynasty-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Fantasy Hub data
        run: python3 afa_sync.py

      - name: Commit updated website
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git config user.name "AFA Sync Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update AFA Fantasy Hub data"
            git push
          fi
